name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Package validation
        run: vulnforge package validate
      - name: Resolver drift
        run: vulnforge triage --check
      - name: Report drift
        run: |
          vulnforge report --all
          git diff --exit-code
      - name: Lint
        run: ruff check src tests

  integration:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Docker integration
        env:
          VULNFORGE_DOCKER: "1"
        run: |
          python -m unittest tests.test_lab_integration -v
          python -m unittest tests.test_adapter_contract.ToyAdapterDockerTests -v
