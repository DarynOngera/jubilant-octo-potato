# Top-level research configuration consumed by the CLI (see README).
package: bandit
hex_advisories_url: "https://hex.pm/packages/bandit/advisories"
osv_ecosystem: "Hex"
github_repo: "mtrudel/bandit"

targets:
  vulnerable:
    base_url: "http://127.0.0.1:4100"
    admin_url: "http://127.0.0.1:4101"
    bandit_version: "1.13.1"
  interim:
    base_url: "http://127.0.0.1:4120"
    admin_url: "http://127.0.0.1:4121"
    bandit_version: "1.14.0"
  patched:
    base_url: "http://127.0.0.1:4110"
    admin_url: "http://127.0.0.1:4111"
    bandit_version: "1.14.1"

priority_weights:
  impact: 0.40
  exploitability: 0.35
  reachability: 0.15
  detectability: 0.10

priority_tiers:
  E4:
    threshold: 8
    label: "low complexity, unauthenticated, remote"
  E3:
    threshold: 6
    label: "straightforward protocol interaction"
  E2:
    threshold: 4
    label: "needs specific protocol feature/topology"
  E1:
    threshold: 0
    label: "unusual config / multiple prerequisites"
